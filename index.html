<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Vemos el partido?</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* â”€â”€ Page 1 â”€â”€ */
    #page1 {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      transition: opacity 0.6s ease;
    }

    #page1.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #spurs-logo-1 {
      width: 190px;
      height: 190px;
      object-fit: contain;
      animation: floatIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    #invite-text {
      font-size: clamp(1.3rem, 3.5vw, 2.1rem);
      font-weight: 700;
      color: #111111;
      text-align: center;
      max-width: 540px;
      padding: 0 28px;
      line-height: 1.35;
      animation: floatIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
    }

    #btn-yes {
      background: #C4A962;
      color: #000000;
      border: none;
      padding: 16px 44px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
      box-shadow: 0 4px 22px rgba(196, 169, 98, 0.45);
      animation: floatIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
      position: relative;
      z-index: 2;
    }

    #btn-yes:hover {
      box-shadow: 0 6px 32px rgba(196, 169, 98, 0.65);
    }

    #btn-no {
      position: fixed;
      background: #ebebeb;
      color: #777777;
      border: none;
      padding: 14px 30px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      transform-origin: center center;
      transition: left 0.25s ease, top 0.25s ease, transform 0.3s ease, opacity 0.4s ease;
      white-space: nowrap;
      user-select: none;
      z-index: 5;
    }

    /* â”€â”€ Page 2 â”€â”€ */
    #page2 {
      position: absolute;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.65s ease;
      z-index: 10;
    }

    #page2.visible {
      opacity: 1;
      pointer-events: all;
    }

    #logo-wrap-p2 {
      background: #ffffff;
      border-radius: 50%;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    }
    #spurs-logo-2 {
      width: 140px;
      height: 140px;
      object-fit: contain;
    }

    #accepted-title {
      font-size: clamp(2rem, 5.5vw, 3.4rem);
      font-weight: 800;
      color: #C4A962;
      text-align: center;
      animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.48s both;
    }

    #match-time {
      font-size: clamp(1.1rem, 2.8vw, 1.65rem);
      font-weight: 600;
      color: #ffffff;
      animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.63s both;
    }

    #match-info {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      font-weight: 400;
      color: #888888;
      letter-spacing: 0.02em;
      animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.78s both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.55); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <script>
    const NO_TEXTS = ["No...", "En serio no", "Nah", "Que no", "Nooooo", "Dejame", "...", "ok ya"];

    const YES_TEXTS = ["¿Siiii?", "¡Ándale!", "¡Ya di que sí!", "¡Ven ya!", "¡SIII!", "¡¡SÍ!!!!"];
    let noClicks  = 0;
    let noScale   = 1.0;
    let yesScale  = 1.0;

    const btnNo  = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    const page1  = document.getElementById('page1');
    const page2  = document.getElementById('page2');

    // Anchor No button next to Yes button on first paint
    window.addEventListener('load', () => {
      const yr = btnYes.getBoundingClientRect();
      btnNo.style.top  = yr.top + 'px';
      btnNo.style.left = (yr.right + 20) + 'px';
    });

    function handleNo() {
      noClicks++;

      // Update text (stay on last one after exhausted)
      btnNo.textContent = NO_TEXTS[Math.min(noClicks, NO_TEXTS.length - 1)];

      // Shrink No, grow SÃ­
      noScale  = Math.max(0, parseFloat((noScale  - 0.12).toFixed(4)));
      btnYes.textContent = YES_TEXTS[Math.min(noClicks - 1, YES_TEXTS.length - 1)];
      yesScale = Math.min(2.5, parseFloat((yesScale + 0.10).toFixed(4)));

      btnYes.style.transform = `scale(${yesScale})`;

      if (noScale <= 0) {
        btnNo.style.visibility = 'hidden';
        return;
      }

      btnNo.style.transform = `scale(${noScale})`;

      // Random position â€” keep inside viewport
      const pad = 24;
      const bw  = btnNo.offsetWidth  * noScale;
      const bh  = btnNo.offsetHeight * noScale;
      const maxX = Math.max(pad, window.innerWidth  - bw - pad);
      const maxY = Math.max(pad, window.innerHeight - bh - pad);

      btnNo.style.left = (pad + Math.random() * (maxX - pad)) + 'px';
      btnNo.style.top  = (pad + Math.random() * (maxY - pad)) + 'px';
    }

    function handleYes() {
      page1.classList.add('fade-out');
      btnNo.style.opacity = '0';
      setTimeout(() => {
        page2.classList.add('visible');
      }, 500);

      // NotificaciÃ³n push a Rogie cuando Aleika dice sÃi
      fetch('https://ntfy.sh/spurs-aleika-rogie-2025', {
        method: 'POST',
        headers: {
          'Title': 'Aleika dijo que Si!',
          'Priority': 'high',
          'Tags': 'basketball'
        },
        body: '¡Aleika acepta ver el partido de Spurs mañana a las 7:30 PM!'
      }).catch(() => {});
    }
  </script>
